[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sulib"
version = "1.0.3"
license-files = ["LICENSE"]
description = "Python library for the SU-decomposition algorithm, the Dual-Upper-Triangular Invariant Representation (DUTIR), and related numerical algorithms."
readme = "README.md"
authors = [
{ name = "Arno Verduyn" },
{ name = "Erwin Aertbeliën" },
{ name = "Maxim Vochten" }
]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Intended Audience :: Science/Research",
]

[project.urls]
Repository = "https://github.com/arnoverduyn/SU_decomposition"
Paper = "https://arxiv.org/abs/2604.10241"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
